<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" data-fg-d3bl0="0.8:10.33960:/src/app/App.tsx:68:5:2686:12879:e:svg:etxtetetetxtxtxtetxtetxtetxtetxtetetetxtetetetxtete:1" data-fgid-d3bl0=":r8:" data-fg-callsite-d3bl100="" style="display: block;"><defs data-fg-d3bl1="0.8:10.33960:/src/app/App.tsx:76:7:2863:453:e:defs:ete"><style data-fg-d3bl2="0.8:10.33960:/src/app/App.tsx:77:9:2878:25:e:style:x">
  /* ── whole-vine group sways ── */
  @keyframes vineRockL {
    0%,100% { transform: rotate(0deg);    }
    40%      { transform: rotate(-2.5deg); }
    70%      { transform: rotate(1.2deg);  }
  }
  @keyframes vineRockR {
    0%,100% { transform: rotate(0deg);   }
    40%      { transform: rotate(2.5deg); }
    70%      { transform: rotate(-1.2deg);}
  }
  /* ── individual leaf sways ── */
  @keyframes swayR {
    0%,100% { transform: rotate(0deg);  }
    50%      { transform: rotate(14deg); }
  }
  @keyframes swayL {
    0%,100% { transform: rotate(0deg);   }
    50%      { transform: rotate(-14deg); }
  }
  /* ── text ── */
  @keyframes textShimmer {
    0%,100% { opacity: 1;    }
    50%      { opacity: 0.82; }
  }
  /* ── dots ── */
  @keyframes dotPop {
    0%,100% { transform: scale(1);   opacity: 1;   }
    50%      { transform: scale(1.4); opacity: 0.5; }
  }

  /* vine groups — anchor at the sign edge so they pivot there */
  .vtl { transform-box: fill-box; transform-origin: 100% 100%; animation: vineRockL 4.2s ease-in-out infinite; }
  .vtr { transform-box: fill-box; transform-origin: 0%   100%; animation: vineRockR 3.8s ease-in-out infinite 0.6s; }
  .vbl { transform-box: fill-box; transform-origin: 100% 0%;   animation: vineRockL 4.6s ease-in-out infinite 1.1s; }
  .vbr { transform-box: fill-box; transform-origin: 0%   0%;   animation: vineRockR 4.0s ease-in-out infinite 0.3s; }

  /* leaves */
  .leaf { transform-box: fill-box; transform-origin: 25% 75%; }
  .la { animation: swayR 2.8s ease-in-out infinite; }
  .lb { animation: swayL 3.3s ease-in-out infinite 0.5s; }
  .lc { animation: swayR 3.7s ease-in-out infinite 1.1s; }
  .ld { animation: swayL 2.6s ease-in-out infinite 0.3s; }
  .le { animation: swayR 3.1s ease-in-out infinite 0.9s; }
  .lf { animation: swayL 2.4s ease-in-out infinite 1.4s; }

  .echo-face { animation: textShimmer 5s ease-in-out infinite; }
  .dot { transform-box: fill-box; transform-origin: center; }
  .d1 { animation: dotPop 2.4s ease-in-out infinite; }
  .d2 { animation: dotPop 2.4s ease-in-out infinite 0.5s; }
  .d3 { animation: dotPop 2.4s ease-in-out infinite 1.0s; }
